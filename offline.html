
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101012">
  <title>Offline | KOREANSTREAM</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, Helvetica, sans-serif;
      background: #101012;
      color: #f5f5f5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at top, #382027 0%, transparent 55%),
        #101012;
    }

    main {
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    .brand {
      margin-bottom: 48px;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: 4px;
    }

    .symbol {
      display: grid;
      place-items: center;
      width: 84px;
      height: 84px;
      margin: 0 auto 28px;
      border: 1px solid #60404a;
      border-radius: 50%;
      background: #24171c;
      color: #e7a4b5;
      font-size: 34px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(28px, 7vw, 40px);
      letter-spacing: -1px;
    }

    p {
      margin: 0 auto 28px;
      max-width: 360px;
      color: #aaa6ab;
      font-size: 15px;
      line-height: 1.8;
    }

    button {
      min-height: 48px;
      padding: 0 24px;
      border: 0;
      border-radius: 6px;
      background: #e7a4b5;
      color: #171114;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #f2bdca;
    }

    button:focus-visible {
      outline: 2px solid white;
      outline-offset: 4px;
    }

    .footer {
      margin-top: 56px;
      color: #6e6b70;
      font-size: 11px;
      letter-spacing: 2px;
    }
  </style>
</head>

<body>
  <main>
    <div class="brand">KOREANSTREAM</div>

    <div class="symbol" aria-hidden="true">↗</div>

    <h1>You're offline</h1>

    <p>
      Your internet connection appears to be unavailable.
      Reconnect to the internet and try again to discover
      your favorite Korean dramas and movies.
    </p>

    <button type="button" onclick="window.location.reload()">
      Try Again
    </button>

    <div class="footer">KOREAN STORIES, ONE DESTINATION</div>
  </main>
</body>
</html>
